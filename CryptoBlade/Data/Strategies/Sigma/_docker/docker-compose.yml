services:
  cryptoblade:
    container_name: sigma_live
    image: cryptoblade:latest
    labels:
        - "autoheal=true"
    ports:
        - 8098:80
    volumes:
        - ../Backtest:/app/Data/Strategies/Sigma/Backtest
        - ../../../HistoricalData:/app/Data/HistoricalData
    environment:
        - CB_TradingBot__AccountName=Demo
        - CB_TradingBot__BotMode=Live
        - CB_TradingBot__DcaOrdersCount=1000
        - CB_TradingBot__DynamicBotCount__MaxDynamicStrategyOpenPerStep=10
        - CB_TradingBot__DynamicBotCount__MaxLongStrategies=100
        - CB_TradingBot__DynamicBotCount__MaxShortStrategies=0
        - CB_TradingBot__DynamicBotCount__Step=00:01:00
        - CB_TradingBot__DynamicBotCount__TargetLongExposure=200.0
        - CB_TradingBot__DynamicBotCount__TargetShortExposure=0
        - CB_TradingBot__EnableRecursiveQtyFactorLong=True
        - CB_TradingBot__EnableRecursiveQtyFactorShort=True
        - CB_TradingBot__ForceMinQty=False
        - CB_TradingBot__MakerFeeRate=0.0002
        - CB_TradingBot__MaxAbsFundingRate=0.0002
        - CB_TradingBot__MaxRunningStrategies=30
        - CB_TradingBot__MinimumPriceDistance=0.015
        - CB_TradingBot__MinimumVolume=15000.0
        - CB_TradingBot__MinNormalizedAverageTrueRangePeriod=1.0
        - CB_TradingBot__MinProfitRate=0.0006
        - CB_TradingBot__NormalizedAverageTrueRangePeriod=14
        - CB_TradingBot__PlaceOrderAttempts=5
        - CB_TradingBot__QtyFactorLong=2.0
        - CB_TradingBot__QtyFactorShort=0
        - CB_TradingBot__SpotRebalancingRatio=0.0
        - CB_TradingBot__StrategyName=Sigma
        - CB_TradingBot__StrategySelectPreference=0
        - CB_TradingBot__TakerFeeRate=0.00055
        - CB_TradingBot__TradingMode=Dynamic
        - CB_TradingBot__WalletExposureLong=50.0
        - CB_TradingBot__WalletExposureShort=0.0
        - CB_TradingBot__Whitelist__0=BTCUSDT
        - CB_TradingBot__Whitelist__1=ETHUSDT
        - CB_TradingBot__Whitelist__10=TRXUSDT
        - CB_TradingBot__Whitelist__11=MATICUSDT
        - CB_TradingBot__Whitelist__12=DOTUSDT
        - CB_TradingBot__Whitelist__13=NEARUSDT
